plugins {
    id 'com.android.application'
}

// Everything app-specific comes from Gradle properties, which the build workflow passes:
//   -PappId=uk.smti.app.xxx -PappName="..." -PversionCode=1 -PversionName=1.0
// The site list itself is in src/main/assets/config.json.
def appId = project.findProperty('appId') ?: 'uk.smti.webapp.demo'
def appName = project.findProperty('appName') ?: 'אפליקציה'
// AGP escapes &, < and > itself; quotes, apostrophes and a leading @ or ? still need escaping.
def resEscape = { String v ->
    v = v.replace('\\', '\\\\').replace("'", "\\'").replace('"', '\\"')
    (v.startsWith('@') || v.startsWith('?')) ? '\\' + v : v
}
def vCode = (project.findProperty('versionCode') ?: '1') as int
def vName = project.findProperty('versionName') ?: '1.0'

android {
    namespace 'uk.smti.webapp'
    compileSdk 34

    defaultConfig {
        applicationId appId
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName vName
        resValue 'string', 'app_name', resEscape(appName)
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'smt'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
